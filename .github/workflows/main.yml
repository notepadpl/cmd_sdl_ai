name: Build and Deploy Emscripten Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Wymagane uprawnienia do wrzucania strony na GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Zapobiega nakładaniu się wielu wdrożeń naraz
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie kodu źródłowego projektu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalacja i konfiguracja Emscripten SDK (z użyciem cache)
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      # 3. Kompilacja projektu z Twoim plikiem shell.html
      - name: Compile with Emcc
        run: |
          mkdir -p build
          emcc cmd.c -o build/index.html \
            -s USE_SDL=2 \
            -s USE_SDL_TTF=2 \
            -s USE_SDL_NET=2 \
            -s EXPORTED_RUNTIME_METHODS='["ccall", "cwrap"]' \
            --preload-file assets \
            --shell-file shell.html \
            -O3

      # 4. Spakowanie i wysłanie jako tradycyjny Artifact (ZIP)
      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webassembly-app
          path: build/
          retention-days: 7

      # 5. Konfiguracja GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. Przygotowanie paczki pod GitHub Pages z folderu build
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      # 7. Właściwy Deploy (publikacja strony online)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
