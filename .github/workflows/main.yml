name: Build Emscripten Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie kodu źródłowego projektu
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalacja i konfiguracja Emscripten SDK (z użyciem cache, żeby nie pobierać za każdym razem)
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      # 3. Kompilacja projektu (zastąp poniższe polecenie swoim faktycznym poleceniem emcc)
      - name: Compile with Emcc
        run: |
          mkdir -p build
          emcc cmd_ia_sdl/cmd.c -o build/index.html \
            -s USE_SDL=2 \
            -s USE_SDL_TTF=2 \
            -s EXPORTED_RUNTIME_METHODS='["ccall", "cwrap"]' \
            --preload-file assets \
            -O3

      # 4. KLUCZOWE: Spakowanie i wysłanie jako Artifact TYLKO folderu 'build'
      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webassembly-app
          path: build/
          retention-days: 7
