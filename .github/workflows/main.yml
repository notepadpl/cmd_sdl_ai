name: Build and Deploy Emscripten Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      - name: Compile with Emcc
        run: |
          mkdir -p build
          emcc main.c -o build/index.html \
            -s USE_SDL=2 \
            -s USE_SDL_TTF=2 \
            -s USE_SDL_NET=2 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS='["_main","_zewnetrzny_input_ai"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","UTF8ToString"]' \
            --preload-file assets \
            --shell-file shell.html \
            -O3

      - name: Commit build artifacts to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/
          if git diff --staged --quiet; then
            echo "Brak zmian w katalogu build/ do commitowania."
          else
            git commit -m "chore(build): aktualizuj pliki kompilacji Wasm [skip ci]"
            git push
          fi

      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webassembly-app
          path: build/
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
