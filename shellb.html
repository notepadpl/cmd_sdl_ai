<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix AI Terminal - C & WebAssembly</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            gap: 10px;
        }
        .input-container {
            width: 100%;
            max-width: 750px;
            display: flex;
            gap: 5px;
            order: 1;
        }
        #terminal-input {
            flex-grow: 1;
            background-color: #050505;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            font-size: 16px;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }
        #send-btn {
            background-color: #002200;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        #send-btn:active {
            background-color: #00ff00;
            color: #000;
        }
        .emscripten_border {
            border: 2px solid #00ff00;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border-radius: 4px;
            width: 100%;
            max-width: 750px;
            order: 2;
        }
        #canvas {
            width: 100%;
            height: auto;
            display: block;
            outline: none;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <!-- Pasek wpisywania na górze ekranu -->
    <div class="input-container">
        <input type="text" id="terminal-input" placeholder="Wpisz komendę dla AI..." autocomplete="off">
        <button id="send-btn" onclick="wyslijKomende()">WYŚLIJ</button>
    </div>

    <div class="emscripten_border">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>

    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) { console.log("[WASM OUT]: " + text); },
            printErr: function(text) { console.error("[WASM ERR]: " + text); },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };

        // Funkcja wysyłająca dane do pliku w C przez Module.ccall
        function wyslijKomende() {
            var input = document.getElementById('terminal-input');
            var val = input.value.trim();
            
            if (val.length > 0) {
                if (typeof Module.ccall === 'function') {
                    // Wywołanie funkcji z C: nazwa, typ zwracany, tablica typów, tablica argumentów
                    Module.ccall('zewnetrzny_input_ai', null, ['string'], [val]);
                    console.log("Wysłano do C: " + val);
                } else {
                    console.error("Module.ccall nie jest jeszcze gotowy!");
                }
                input.value = '';
            }
        }

        // Obsługa klawisza Enter w polu tekstowym
        document.getElementById('terminal-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                wyslijKomende();
            }
        });
    </script>

    {{{ SCRIPT }}}

</body>
</html>
