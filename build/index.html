<!doctypehtml><html lang=pl><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Matrix AI Terminal - C & WebAssembly</title><style>body{background-color:#000;color:#0f0;font-family:monospace;margin:0;padding:10px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;min-height:100vh;box-sizing:border-box;gap:10px}.input-container{width:100%;max-width:750px;display:flex;gap:5px;order:1}#terminal-input{flex-grow:1;background-color:#050505;border:1px solid #0f0;color:#0f0;font-family:monospace;font-size:16px;padding:8px;border-radius:4px;outline:0}#send-btn{background-color:#020;border:1px solid #0f0;color:#0f0;font-family:monospace;font-weight:700;padding:8px 15px;border-radius:4px;cursor:pointer}#send-btn:active{background-color:#0f0;color:#000}.emscripten_border{border:2px solid #0f0;background-color:#000;box-shadow:0 0 20px rgba(0,255,0,.2);border-radius:4px;width:100%;max-width:750px;order:2}#canvas{width:100%;height:auto;display:block;outline:0;background-color:#000}.output-container{width:100%;max-width:750px;border:1px solid #0a0;background-color:#040a04;border-radius:4px;padding:8px;box-sizing:border-box;order:3}.output-header{font-size:12px;color:#7f7;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}#clear-out-btn{background:#001800;color:#0f0;border:1px solid #080;font-family:monospace;font-size:11px;padding:2px 8px;border-radius:3px;cursor:pointer}#terminal-output{margin:0;height:170px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.35}.out-err{color:#f66}.out-sys{color:#8f8}</style></head><body><div class=input-container><input autocomplete=off id=terminal-input placeholder="Wpisz komendę (POST -> Wasm)..."> <button id=send-btn onclick=wyslijKomende()>POST</button></div><div class=emscripten_border><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=0></canvas></div><div class=output-container><div class=output-header><span>OUTPUT (WASM / POST BRIDGE)</span> <button id=clear-out-btn onclick=wyczyscOutput()>WYCZYŚĆ</button></div><pre id=terminal-output></pre></div><script>const POST_URL="/upload/post",POLL_URL="/latest-post";let lastExternalMsg=null;function dopiszOutput(t,e=""){const n=document.getElementById("terminal-output"),o=document.createElement("div");e&&(o.className=e),o.textContent=t,n.appendChild(o),n.scrollTop=n.scrollHeight}function wyczyscOutput(){document.getElementById("terminal-output").innerHTML=""}function przekazDoWasm(t){return void 0!==Module&&"function"==typeof Module.ccall?(Module.ccall("zewnetrzny_input_ai",null,["string"],[t]),dopiszOutput("[WASM <-] "+t,"out-sys"),!0):(dopiszOutput("[ERR] Module.ccall nie jest jeszcze gotowy!","out-err"),!1)}window.onDzinReply=function(t){dopiszOutput("[DZIN ->] "+t,"out-sys")};var Module={preRun:[],postRun:[],print:function(t){console.log("[WASM OUT]: "+t),dopiszOutput("[OUT] "+t)},printErr:function(t){console.error("[WASM ERR]: "+t),dopiszOutput("[ERR] "+t,"out-err")},canvas:document.getElementById("canvas")};async function wyslijKomende(){const t=document.getElementById("terminal-input"),e=t.value.trim();if(e){t.value="",dopiszOutput("[POST ->] "+e,"out-sys");try{const t=await fetch(POST_URL,{method:"POST",headers:{"Content-Type":"text/plain; charset=utf-8"},body:e});t.ok||dopiszOutput("[POST WARN] HTTP "+t.status,"out-err")}catch(t){dopiszOutput("[POST FAIL] "+t.message+" (wywołuję lokalnie Wasm)","out-err")}przekazDoWasm(e)}}async function pollIncomingPost(){try{const t=await fetch(POLL_URL,{cache:"no-store"});if(!t.ok)return;const e=(await t.text()).trim();e&&e!==lastExternalMsg&&(lastExternalMsg=e,dopiszOutput("[CURL/FILE] "+e,"out-sys"),przekazDoWasm(e))}catch(t){}}document.getElementById("terminal-input").addEventListener("keydown",function(t){"Enter"===t.key&&wyslijKomende()}),setInterval(pollIncomingPost,1e3)</script><script async src=index.js></script></body></html>
