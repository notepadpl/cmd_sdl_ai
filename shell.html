<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix AI Terminal - C & WebAssembly</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .emscripten_border {
            border: 2px solid #00ff00;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border-radius: 4px;
            width: 100%;
            max-width: 750px; /* Okno nigdy nie będzie za duże! */
        }
        #canvas {
            width: 100%;
            height: auto; /* Płynne skalowanie proporcjonalne */
            display: block;
            outline: none;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div class="emscripten_border">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>

    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log("[WASM OUT]: " + text);
            },
            printErr: function(text) {
                console.error("[WASM ERR]: " + text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                
                // Automatyczne łapanie fokusu i aktywacja klawiatury przy kliknięciu
                window.addEventListener('load', function() {
                    canvas.focus();
                });
                window.addEventListener('click', function() {
                    canvas.focus();
                });
                canvas.addEventListener('click', function(e) {
                    e.stopPropagation();
                    canvas.focus();
                });

                return canvas;
            })(),
            setStatus: function(text) {
                if (text) console.log("Status: " + text);
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = left;
            }
        };

        window.onerror = function(event) {
            console.error("Błąd krytyczny WebAssembly: " + event);
        };
    </script>

    {{{ SCRIPT }}}

</body>
</html>
