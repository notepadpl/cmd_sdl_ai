<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix AI Terminal - C & WebAssembly</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            gap: 10px;
        }
        .input-container {
            width: 100%;
            max-width: 750px;
            display: flex;
            gap: 5px;
            order: 1;
        }
        #terminal-input {
            flex-grow: 1;
            background-color: #050505;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            font-size: 16px;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }
        #send-btn, #clear-msg-btn {
            background-color: #002200;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: monospace;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        #send-btn:active, #clear-msg-btn:active {
            background-color: #00ff00;
            color: #000;
        }
        .emscripten_border {
            border: 2px solid #00ff00;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border-radius: 4px;
            width: 100%;
            max-width: 750px;
            order: 2;
        }
        #canvas {
            width: 100%;
            height: auto;
            display: block;
            outline: none;
            background-color: #000000;
        }
        .output-container {
            width: 100%;
            max-width: 750px;
            border: 1px solid #00aa00;
            background-color: #020502;
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            order: 3;
        }
        .output-header {
            font-size: 12px;
            color: #77ff77;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #004400;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #clear-out-btn {
            background: #001800;
            color: #00ff00;
            border: 1px solid #008800;
            font-family: monospace;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
        .term-screen {
            height: 190px;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            line-height: 1.4;
            color: #33ff33;
        }
        #terminal-output {
            margin: 0;
            display: inline;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .term-prompt {
            color: #88ff88;
            font-weight: bold;
        }
        .term-cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background-color: #33ff33;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. Pasek wpisywania (PHP POST + Wasm) na górze -->
    <div class="input-container">
        <input type="text" id="terminal-input" placeholder="Wpisz komendę (POST -> /index.php?api=1 & Wasm)..." autocomplete="off">
        <button id="send-btn" onclick="wyslijKomende()">POST</button>
        <button id="clear-msg-btn" onclick="wyczyscRemoteMsg()">CLR MSG</button>
    </div>

    <!-- 2. Okno SDL / Canvas / Wasm w środku -->
    <div class="emscripten_border">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    </div>

    <!-- 3. Panel Output w stylu terminala pod spodem -->
    <div class="output-container">
        <div class="output-header">
            <span>dzin@wasm:~/shell$</span>
            <button id="clear-out-btn" onclick="wyczyscOutput()">CLEAR</button>
        </div>
        <div class="term-screen" id="term-screen" onclick="document.getElementById('terminal-input').focus()">
            <span class="term-prompt">dzin@wasm:~$ </span><pre id="terminal-output"></pre><span class="term-cursor"></span>
        </div>
    </div>

    <script type='text/javascript'>
        const POST_URL = '/index.php?api=1';
        const CLEAR_URL = '/index.php?api=1&action=clear';
        const POLL_URL = '/msg.txt';

        let lastExternalMsg = null;

        function dopiszOutput(text) {
            const screen = document.getElementById('term-screen');
            const out = document.getElementById('terminal-output');
            if (!out || !screen) return;

            const str = String(text);
            out.textContent += (out.textContent && !out.textContent.endsWith('\n') ? '\n' : '') + str;
            screen.scrollTop = screen.scrollHeight;
        }

        function wyczyscOutput() {
            const out = document.getElementById('terminal-output');
            if (out) out.textContent = '';
        }

        function przekazDoWasm(val) {
            if (typeof Module !== 'undefined' && typeof Module.ccall === 'function') {
                Module.ccall('zewnetrzny_input_ai', null, ['string'], [val]);
                return true;
            }
            dopiszOutput('Module.ccall not ready');
            return false;
        }

        // Odpowiedzi wychodzące z Wasm (przez EM_JS -> window.onDzinReply)
        window.onDzinReply = function(text) {
            if (text) {
                dopiszOutput(String(text));
            }
        };

        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log("[WASM OUT]: " + text);
                dopiszOutput(text);
            },
            printErr: function(text) {
                console.error("[WASM ERR]: " + text);
                dopiszOutput(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })()
        };

        // Wysyłka komendy do index.php (zdalne zapisanie w msg.txt) + przekazanie do Wasm
        async function wyslijKomende() {
            const input = document.getElementById('terminal-input');
            const val = input.value.trim();
            if (!val) return;

            input.value = '';
            dopiszOutput('$ ' + val);

            try {
                const resp = await fetch(POST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                    body: val
                });
                const srvText = (await resp.text()).trim();
                if (!resp.ok) {
                    dopiszOutput('HTTP ' + resp.status + (srvText ? ': ' + srvText : ''));
                } else if (srvText) {
                    dopiszOutput(srvText);
                }
            } catch (err) {
                dopiszOutput('POST error: ' + err.message);
            }

            przekazDoWasm(val);
        }

        async function wyczyscRemoteMsg() {
            try {
                const resp = await fetch(CLEAR_URL, {
                    method: 'POST',
                    cache: 'no-store'
                });
                const txt = (await resp.text()).trim();
                lastExternalMsg = '';
                dopiszOutput(txt || 'msg.txt cleared');
            } catch (err) {
                dopiszOutput('Clear error: ' + err.message);
            }
        }

        // Odbiór komend wysłanych zdalnie (np. przez curl -X POST na /index.php?api=1)
        async function pollIncomingPost() {
            try {
                const resp = await fetch(POLL_URL, { cache: 'no-store' });
                if (!resp.ok) return;
                const text = (await resp.text()).trim();
                if (text && text !== lastExternalMsg) {
                    lastExternalMsg = text;
                    dopiszOutput(text);
                    przekazDoWasm(text);

                    await fetch(CLEAR_URL, {
                        method: 'POST',
                        cache: 'no-store'
                    });
                    lastExternalMsg = '';
                }
            } catch (_) {
                // Ignoruj chwilowy brak połączenia przy odpytywaniu
            }
        }

        document.getElementById('terminal-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                wyslijKomende();
            }
        });

        setInterval(pollIncomingPost, 1000);
    </script>

    {{{ SCRIPT }}}

</body>
</html>
